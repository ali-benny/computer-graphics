<!-- 
This file is based on HTML5_webgl_1/draw_triang_element.html
with the following changes:
-- 1.disegnare il quadrato di vertici [-0.5,0.5,0.0, -0.5,-0.5,0.0, 0.5,-0.5,0.0, 0.5,0.5,0.0];
-- 2.disegnare lo stesso quadrato, ma con i seguenti colori per vertice [0,0,1, 1,0,0, 0,1,0, 1,0,1];
-- 3.disegnare il triangolo di vertici [ -1,-1,-1, 0,-1,-1, 0,0,-1 ] e il suo traslato di [0.5, 0.5, 0.0];
-- 4.disegnare il triangolo di vertici [-0.5,0.5,0.0, -0.5,-0.5,0.0, 0.5,0.5, 0.0] scalato di [0.5,1.5,1.0] utilizzando un matrice 4x4
-- 5.disegnare il triangolo al punto 4. con un colore per ogni vertice e che ruoti intorno all’asse z (si usi una matrice 4x4) per dar luogo ad una animazione (sugg. si usi la window.requestAnimationFrame( );)
 -->

<!doctype html>
<html>
<head>
	<style>
		body {
			background-color: aliceblue;
		}
	</style>
</head>

<body>
	<canvas width="300" height="300" id="my_Canvas"></canvas>
	<script>

		/* Step1: Prepare the canvas and get WebGL context */
		var canvas = document.getElementById('my_Canvas');
		var gl = canvas.getContext('experimental-webgl');

		/* Step2: Define the geometry and store it in buffer objects */
		var vertices = [-0.5, 0.5, 0.0, -0.5, -0.5, 0.0, 0.5, -0.5, 0.0, 0.5, 0.5, 0.0];
		// -- 1.
		var indices = [0, 1, 2, 0, 2, 3];    //:= sono attributi e vertici	
		// -- 2.
		var colors = [0,0,1, 1,0,0, 0,1,0, 1,0,1];

		// Create two new buffer object
		var vertex_buffer = gl.createBuffer();
		var color_buffer = gl.createBuffer();
		var index_buffer = gl.createBuffer();
		// Bind empty array buffers to them
		gl.bindBuffer(gl.ARRAY_BUFFER, vertex_buffer);
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, index_buffer);
		// Pass the vertices and indices data to the buffers
		gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
		gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
		// Unbind the buffer
		gl.bindBuffer(gl.ARRAY_BUFFER, null);
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);

		gl.bindBuffer(gl.ARRAY_BUFFER, color_buffer);	//-- 2.
		gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);	//-- 2.

		/* Step3: Create and compile Shader programs */
		// Vertex shader source code 
		var vertCode =
			'attribute vec4 coordinates;' +
			'attribute vec3 color;' +
			'varying vec3 vColor;' +
			'void main(void) {' +
			' gl_Position = coordinates;' +
			' vColor = color;' +
			'}';
		//Create a vertex shader object
		var vertShader = gl.createShader(gl.VERTEX_SHADER);
		//Attach vertex shader source code 
		gl.shaderSource(vertShader, vertCode);
		//Compile the vertex shader 
		gl.compileShader(vertShader);
		//Fragment shader source code 
		var fragCode =
			'precision mediump float;' +
			'varying vec3 vColor;' +
			'void main(void) {' +
			'gl_FragColor = vec4(vColor, 1.0);' +
			'}';
		// Create fragment shader object
		var fragShader = gl.createShader(gl.FRAGMENT_SHADER);
		// Attach fragment shader source code 
		gl.shaderSource(fragShader, fragCode);
		// Compile the fragment shader 
		gl.compileShader(fragShader);
		// Create a shader program object to store combined shader program 
		var shaderProgram = gl.createProgram();
		// Attach a vertex shader 
		gl.attachShader(shaderProgram, vertShader);
		// Attach a fragment shader 
		gl.attachShader(shaderProgram, fragShader);

		// Link both programs 
		gl.linkProgram(shaderProgram);

		// Use the combined shader program object 
		gl.useProgram(shaderProgram);

		/* Step 4: Associate the shader programs to buffer objects */
		//Bind vertex buffer object 
		gl.bindBuffer(gl.ARRAY_BUFFER, vertex_buffer);
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, index_buffer);
		//Get the attribute location
		var coord = gl.getAttribLocation(shaderProgram, "coordinates");
		//point an attribute to the currently bound VBO 
		gl.vertexAttribPointer(coord, 3, gl.FLOAT, false, 0, 0);	//? vertici o indici? con gli indici non devo replicare i
		//Enable the attribute 
		gl.enableVertexAttribArray(coord);	//: farà riferimento agli indici in automatico
		gl.bindBuffer(gl.ARRAY_BUFFER, color_buffer);	//-- 2.

		var color = gl.getAttribLocation(shaderProgram, "color");	//-- 2.
		gl.vertexAttribPointer(color, 3, gl.FLOAT, false, 0, 0);	//-- 2.
		gl.enableVertexAttribArray(color);	//--

		/* Step5: Drawing the required object (triangle) */
		// Clear the canvas
		gl.clearColor(0.5, 0.5, .5, 1);
		// Clear the color buffer bit 
		gl.clear(gl.COLOR_BUFFER_BIT);
		// Set the view port 
		//		gl.viewport(0,0,canvas.width,canvas.height);
		// Draw the triangle 
		gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);	//: indices.length = 3, gl.UNSIGNED_SHORT = type of indices, 0 = offset in the element array buffer
	</script>
</body>

</html>
