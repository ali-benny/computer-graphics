<!doctype html>
<html>

<body>
	<canvas width="300" height="300" id="my_Canvas"></canvas>
	<script>
		'use strict';
		/* Step1: Prepare the canvas and get WebGL context */
		var canvas = document.getElementById('my_Canvas');
		var gl = canvas.getContext('webgl');	//: riferimento al contesto API WebGL richiesto per essere usato su canvas

		/* Step2: Define the geometry and store it in buffer objects */
		//		var vertices = [ -0.5,-0.5,  -0.25,0.5,   0.0,-0.5,];	//: un triangolo con 3 vertici
		// var vertices = [-0.5,-0.5, -0.25,0.5, 0.0,-0.5, 0.0,-0.5, 0.25,0.5, 0.5,-0.5];	//: 6 vertici per 2 triangoli, con 3 vertici in comune	
		var vertices = [-0.5, -0.5, 0.0, -0.25, 0.5, 0.0, 0.0, -0.5, 0.0];	//: un triangolo 3D con 3 vertici

		// Create a new buffer object
		var vertex_buffer = gl.createBuffer();
		// Bind an empty array buffer to it 
		gl.bindBuffer(gl.ARRAY_BUFFER, vertex_buffer);
		// Pass the vertices data to the buffer
		gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);	//: con gli indici
		// Unbind the buffer
		gl.bindBuffer(gl.ARRAY_BUFFER, null);	//: ci sono altri tipi di chiamate in vece di 'null'

		/* Step3: Create and compile Shader programs */
		// - Vertex shader source code 
		var vertCode =
			'attribute vec2 coordinates;' +		//: definisco una var di tipo ved2 con attributes coordinates, che è un array di 2 float (x,y) per ogni vertice
			'void main(void) {' +
			' gl_Position = vec4(coordinates,0.0, 1.0);' + 	//: creo un'altra variabile di tipo vec4 (x,y,z,w) che è la posizione finale del vertice, con z=0 e w=1
			'}';
		//Create a vertex shader object
		var vertShader = gl.createShader(gl.VERTEX_SHADER);
		//Attach vertex shader source code 
		gl.shaderSource(vertShader, vertCode);
		//Compile the vertex shader 
		gl.compileShader(vertShader);

		// - Fragment shader source code 
		var fragCode =
			'void main(void) {' +
			'gl_FragColor = vec4(0.0, 1.0, 0.0, 1);' + 	//: è altra variabile predefinita di tipo vec4 - il COLORE finale del frammento, con r=0, g=1, b=0 e a=1 (verde pieno)
			'}';
		// Create fragment shader object
		var fragShader = gl.createShader(gl.FRAGMENT_SHADER);

	//+ è utile fare debugging degli shader con getShaderParameter e getShaderInfoLog, per vedere se ci sono errori di sintassi o di compilazione negli shader
		if (!gl.getShaderParameter(fragShader, gl.COMPILE_STATUS)) {
			throw new Error(gl.getShaderInfoLog(fragShader))
		};

		// Attach fragment shader source code 
		gl.shaderSource(fragShader, fragCode);
		// Compile the fragment shader 
		gl.compileShader(fragShader);

		// Create a shader program object to store combined shader program 	//: una volta linkati i due shader -> creo un unico oggetto
		var shaderProgram = gl.createProgram();
		// Attach a vertex shader 
		gl.attachShader(shaderProgram, vertShader);
		// Attach a fragment shader 
		gl.attachShader(shaderProgram, fragShader);

		// Link both programs 
		gl.linkProgram(shaderProgram);
		// Use the combined shader program object 
		gl.useProgram(shaderProgram);

		/* Step 4: Associate the shader programs to buffer objects */
		/*: x associare i VBO agli attribute deve essere che:
		:    	- ottenere la posizione dell'attributo nel shader (con getAttribLocation)
		:    	- associare il VBO all'attributo (con vertexAttribPointer)
		:    	- abilitare l'attributo (con enableVertexAttribArray)
		 */
		//Bind vertex buffer object 
		gl.bindBuffer(gl.ARRAY_BUFFER, vertex_buffer);
		//Get the attribute location
		var coord = gl.getAttribLocation(shaderProgram, "coordinates");	//: nome dell'attributo nel vertex shader, che è 'coordinates'
		//point an attribute to the currently bound VBO 
		// gl.vertexAttribPointer(coord, 2, gl.FLOAT, false, 0, 0);	//! IL PROF HA DETTO 3 NON 2
		gl.vertexAttribPointer(coord, 3, gl.FLOAT, false, 0, 0);	//+ IL PROF HA DETTO 3 NON 2: 3 si usa per 3D!
		//Enable the attribute 
		gl.enableVertexAttribArray(coord);

		/* Step5: Drawing the required object (triangle) */
		// Clear the canvas
		gl.clearColor(0.85, 0.85, .85, 1);
		// Enable the depth test
		//		gl.enable(gl.DEPTH_TEST);
		// Clear the color buffer bit 
		gl.clear(gl.COLOR_BUFFER_BIT);
		// Set the view port 
		gl.viewport(0, 0, canvas.width, canvas.height);
		// Draw the triangle/s 
		gl.drawArrays(gl.TRIANGLES, 0, 3);
		//		gl.drawArrays(gl.TRIANGLES, 0, 6);	
	</script>
</body>

</html>
